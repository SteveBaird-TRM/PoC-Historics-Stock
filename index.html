<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historics | Stock comparison</title>
  <style>
    :root { color-scheme: light; --ink: #202b29; --muted: #5c6d67; --line: #d8e1db; --green: #17634f; --wash: #eef4ef; --orange: #9a4427; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f8faf7; font: 15px/1.5 "Trebuchet MS", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; }
    button, input, select, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; border: 1px solid var(--green); border-radius: 4px; padding: 10px 18px; background: var(--green); color: white; font-weight: bold; }
    button:hover:not(:disabled) { background: #114c3d; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #download { display: block; margin-left: auto; margin-bottom: 20px; }
    :focus-visible { outline: 3px solid #cf8a32; outline-offset: 3px; }
    header { border-top: 5px solid var(--green); background: white; border-bottom: 1px solid var(--line); }
    .header-inner { max-width: 1320px; margin: auto; padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font: bold 23px Georgia, serif; }
    .local { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
    .local::before { content: ""; display: block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
    main { max-width: 1320px; margin: auto; padding: 32px; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font: normal 34px/1.2 Georgia, serif; }
    .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .source { min-width: 0; border: 1px solid var(--line); background: white; border-radius: 6px; padding: 22px; }
    .source-heading { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .source label { font-weight: bold; font-size: 18px; }
    .source-heading span { color: var(--muted); font: 13px monospace; }
    input[type=file] { width: 100%; min-width: 0; color: var(--muted); font-size: 13px; }
    input::file-selector-button { padding: 9px 12px; margin-right: 12px; background: var(--wash); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); cursor: pointer; font: inherit; }
    .file-status { margin: 16px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; min-height: 20px; }
    .actions { padding: 20px 0 26px; display: flex; gap: 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .folder { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .folder label { white-space: nowrap; font-weight: bold; font-size: 13px; }
    .folder input { max-width: 270px; }
    #message { border-left: 3px solid var(--green); padding: 12px 16px; margin: 0 0 24px; background: var(--wash); overflow-wrap: anywhere; }
    #message.error { border-color: var(--orange); color: #813720; background: #fcf0e9; }
    [hidden] { display: none !important; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line); margin-bottom: 28px; background: repeating-linear-gradient(135deg, #fff, #fff 10px, #fcfdfb 10px, #fcfdfb 20px); }
    .stat { padding: 20px 24px; border-right: 1px solid var(--line); }
    .stat:first-child { padding-left: 0; }
    .stat:last-child { border-right: none; }
    .stat span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .stat strong { display: block; font: normal 32px/1.4 Georgia, serif; font-variant-numeric: tabular-nums; }
    .stat:nth-child(2) strong { color: var(--green); }
    .stat:nth-child(4) strong { color: var(--orange); }
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    h2 { margin: 0 auto 0 0; font: normal 23px Georgia, serif; }
    input[type=search], select { border: 1px solid #b8c7be; background: white; border-radius: 4px; min-height: 40px; padding: 8px 12px; color: var(--ink); }
    input[type=search] { width: 250px; max-width: 100%; }
    .table-wrap { border-block: 1px solid var(--line); background: white; overflow: auto; max-height: 540px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { text-align: left; background: var(--wash); color: var(--muted); font-size: 11px; text-transform: uppercase; white-space: nowrap; position: sticky; top: 0; }
    th, td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th:first-child, td:first-child { padding-left: 20px; }
    td.product { min-width: 220px; overflow-wrap: anywhere; }
    td.item { white-space: nowrap; font-family: monospace; }
    .numeric { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .status { font-size: 12px; white-space: nowrap; color: var(--orange); }
    .status.zero { color: var(--green); }
    tbody tr:hover { background: #f6f9f6; }
    .empty { text-align: center; padding: 54px 20px; color: var(--muted); }
    .table-footer { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; color: var(--muted); font-size: 12px; }
    @media (max-width: 700px) {
      .header-inner { padding: 18px 20px; }
      main { padding: 24px 20px; }
      h1 { font-size: 28px; }
      .heading { align-items: start; flex-direction: column; gap: 16px; }
      .sources { grid-template-columns: 1fr; gap: 14px; }
      .source { padding: 18px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat, .stat:first-child { padding: 16px; }
      .stat:nth-child(2) { border-right: none; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .toolbar h2 { width: 100%; margin-bottom: 4px; }
      .toolbar input, .toolbar select { width: 100%; }
      .folder { flex-wrap: wrap; }
      .local { font-size: 12px; }
      .brand { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header><div class="header-inner"><div class="brand">Historics</div><div class="local">Local processing</div></div></header>
  <main>
    <div class="heading"><h1>Stock comparison</h1></div>
    <section class="sources" aria-label="Source files">
      <div class="source">
        <div class="source-heading"><label for="sos">Stock on Shelf</label><span>Item_Number</span></div>
        <input id="sos" type="file" accept=".csv,text/csv"><p class="file-status" id="sos-status">No file selected</p>
      </div>
      <div class="source">
        <div class="source-heading"><label for="web">Web inventory</label><span>id / stock</span></div>
        <input id="web" type="file" accept=".csv,text/csv"><p class="file-status" id="web-status">No file selected</p>
      </div>
    </section>
    <div class="actions">
      <div class="folder"><label for="folder">Or select a folder</label><input id="folder" type="file" webkitdirectory multiple></div>
      <button id="compare" disabled>Compare stock</button>
    </div>
    <p id="message" role="status" aria-live="polite" hidden></p>
    <section class="stats" aria-label="Comparison totals">
      <div class="stat"><span>Stock rows</span><strong id="total">0</strong></div>
      <div class="stat"><span>Flagged rows</span><strong id="flagged">0</strong></div>
      <div class="stat"><span>Zero web stock</span><strong id="zero">0</strong></div>
      <div class="stat"><span>Missing from web</span><strong id="missing">0</strong></div>
    </section>
    <button id="download" disabled>Download results CSV</button>
    <section aria-label="Comparison results">
      <div class="toolbar">
        <h2>Flagged inventory</h2>
        <input id="search" type="search" placeholder="Search items" aria-label="Search item number or product" disabled>
        <select id="filter" aria-label="Filter by web status" disabled><option value="all">All statuses</option><option value="Zero web stock">Zero web stock</option><option value="Missing from web">Missing from web</option></select>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th scope="col">Item number</th><th scope="col">Product</th><th class="numeric" scope="col">SOS stock</th><th class="numeric" scope="col">Web stock</th><th scope="col">Status</th></tr></thead><tbody id="results"><tr><td colspan="5" class="empty">No comparison yet</td></tr></tbody></table>
      </div>
      <div class="table-footer"><span id="showing">0 rows</span><span id="download-note" hidden>CSV includes all flagged rows</span></div>
    </section>
  </main>
  <script src="papaparse.min.js"></script>
  <script id="app">
    const element = (id) => document.getElementById(id);
    const sourceFiles = { sos: null, web: null };
    let flaggedRows = [];
    let sosColumns = [];
    let busy = false;
    let revision = 0;
    const numberFormat = new Intl.NumberFormat('en-GB');
    const keyOf = (value) => String(value ?? '').trim().toUpperCase();

    function notify(text, error = false) {
      element('message').textContent = text;
      element('message').classList.toggle('error', error);
      element('message').hidden = !text;
    }

    function updateCompare() {
      element('compare').disabled = busy || !sourceFiles.sos || !sourceFiles.web;
    }

    function clearResults() {
      flaggedRows = [];
      sosColumns = [];
      for (const id of ['total', 'flagged', 'zero', 'missing']) element(id).textContent = '0';
      for (const id of ['download', 'search', 'filter']) element(id).disabled = true;
      element('download-note').hidden = true;
      element('search').value = '';
      element('filter').value = 'all';
      renderRows('No comparison yet');
    }

    function selectFiles(files) {
      revision++;
      Object.assign(sourceFiles, files);
      for (const kind of ['sos', 'web']) {
        element(`${kind}-status`).textContent = sourceFiles[kind] ? sourceFiles[kind].name : 'No file selected';
      }
      clearResults();
      notify('');
      updateCompare();
    }

    for (const kind of ['sos', 'web']) {
      element(kind).addEventListener('change', (event) => selectFiles({ [kind]: event.target.files[0] || null }));
    }

    element('folder').addEventListener('change', (event) => {
      const files = Array.from(event.target.files);
      if (!files.length) return;
      const matches = (name) => files.filter((file) => file.name.toLowerCase() === name);
      const sosMatches = matches('sos.csv');
      const webMatches = matches('web.csv');
      if (sosMatches.length !== 1 || webMatches.length !== 1) {
        selectFiles({ sos: null, web: null });
        notify('The selected folder must contain exactly one sos.csv and one web.csv.', true);
        return;
      }
      element('sos').value = '';
      element('web').value = '';
      selectFiles({ sos: sosMatches[0], web: webMatches[0] });
    });

    async function readCSV(file, required) {
      const text = await file.text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: 'greedy', transformHeader: (header) => header.trim() });
      if (parsed.errors.length) throw new Error(`${file.name}: ${parsed.errors[0].message}`);
      const columns = parsed.meta.fields || [];
      const columnMap = new Map(columns.map((column) => [column.toLowerCase(), column]));
      if (columnMap.size !== columns.length) throw new Error(`${file.name}: duplicate column names.`);
      for (const column of required) {
        if (!columnMap.has(column)) throw new Error(`${file.name}: missing required column "${column}".`);
      }
      if (!parsed.data.length) throw new Error(`${file.name}: no data rows found.`);
      return { rows: parsed.data, columns, columnMap };
    }

    element('compare').addEventListener('click', async () => {
      if (!sourceFiles.sos || !sourceFiles.web || busy) return;
      if (!window.Papa) { notify('CSV parser could not load. Ensure papaparse.min.js is beside this page.', true); return; }
      busy = true;
      const currentRevision = revision;
      updateCompare();
      clearResults();
      notify('Comparing inventories...');
      try {
        const [sos, web] = await Promise.all([readCSV(sourceFiles.sos, ['item_number']), readCSV(sourceFiles.web, ['id', 'stock'])]);
        if (currentRevision !== revision) return;
        for (const column of ['web_stock', 'web_status']) {
          if (sos.columnMap.has(column)) throw new Error(`SOS already contains a reserved output column: ${column}.`);
        }
        const lookup = new Map();
        const webId = web.columnMap.get('id');
        const webStock = web.columnMap.get('stock');
        for (const [index, row] of web.rows.entries()) {
          const key = keyOf(row[webId]);
          const stockText = row[webStock].trim();
          const stock = Number(stockText);
          if (!key) throw new Error(`Web row ${index + 2}: missing id.`);
          if (lookup.has(key)) throw new Error(`Duplicate web id: ${row[webId]}.`);
          if (!stockText || !Number.isFinite(stock)) throw new Error(`Web row ${index + 2}: invalid stock value.`);
          lookup.set(key, { stock, stockText });
        }
        const itemColumn = sos.columnMap.get('item_number');
        const results = [];
        for (const [index, row] of sos.rows.entries()) {
          const key = keyOf(row[itemColumn]);
          if (!key) throw new Error(`SOS row ${index + 2}: missing item number.`);
          const match = lookup.get(key);
          if (!match || match.stock === 0) {
            results.push({ ...row, Web_Stock: match ? match.stockText : '', Web_Status: match ? 'Zero web stock' : 'Missing from web' });
          }
        }
        flaggedRows = results;
        sosColumns = sos.columns;
        element('total').textContent = numberFormat.format(sos.rows.length);
        element('flagged').textContent = numberFormat.format(results.length);
        element('zero').textContent = numberFormat.format(results.filter((row) => row.Web_Status === 'Zero web stock').length);
        element('missing').textContent = numberFormat.format(results.filter((row) => row.Web_Status === 'Missing from web').length);
        for (const id of ['download', 'search', 'filter']) element(id).disabled = false;
        element('download-note').hidden = false;
        element('sos-status').textContent = `${sourceFiles.sos.name} / ${numberFormat.format(sos.rows.length)} rows`;
        element('web-status').textContent = `${sourceFiles.web.name} / ${numberFormat.format(web.rows.length)} rows`;
        renderRows();
        notify('Comparison complete.');
      } catch (error) {
        if (currentRevision === revision) { clearResults(); notify(error.message, true); }
      } finally {
        busy = false;
        updateCompare();
      }
    });

    function renderRows(emptyText = 'No matching items') {
      const query = element('search').value.trim().toLowerCase();
      const status = element('filter').value;
      const findColumn = (name) => sosColumns.find((column) => column.toLowerCase() === name);
      const itemColumn = findColumn('item_number');
      const productColumn = findColumn('product_name');
      const stockColumn = findColumn('total_stock_available');
      const visible = flaggedRows.filter((row) => (status === 'all' || row.Web_Status === status) && (!query || `${row[itemColumn]} ${row[productColumn] || ''}`.toLowerCase().includes(query)));
      const fragment = document.createDocumentFragment();
      for (const row of visible) {
        const tableRow = document.createElement('tr');
        const values = [row[itemColumn], row[productColumn] || '', row[stockColumn] || '', row.Web_Stock === '' ? '-' : row.Web_Stock, row.Web_Status];
        const classes = ['item', 'product', 'numeric', 'numeric', row.Web_Status === 'Zero web stock' ? 'status zero' : 'status'];
        values.forEach((value, index) => {
          const cell = document.createElement('td');
          cell.textContent = value;
          cell.className = classes[index];
          tableRow.append(cell);
        });
        fragment.append(tableRow);
      }
      if (!visible.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 5;
        cell.className = 'empty';
        cell.textContent = emptyText;
        row.append(cell);
        fragment.append(row);
      }
      element('results').replaceChildren(fragment);
      element('showing').textContent = `${numberFormat.format(visible.length)} of ${numberFormat.format(flaggedRows.length)} rows`;
    }

    element('search').addEventListener('input', () => renderRows());
    element('filter').addEventListener('change', () => renderRows());
    element('download').addEventListener('click', () => {
      const columns = [...sosColumns, 'Web_Stock', 'Web_Status'];
      const csv = Papa.unparse({ fields: columns, data: flaggedRows.map((row) => columns.map((column) => row[column])) }, { escapeFormulae: true });
      const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'sos_zero_or_missing_web_stock.csv';
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
